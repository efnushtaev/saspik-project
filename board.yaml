# ─── Плата: данные, а не код ─────────────────────────────────────────────
# Генератор esp32-12v-3v3-schematic.py читает этот файл; правки геометрии —
# здесь, правки оформления (тексты, таблицы) — в скрипте.
meta:
  name: esp32-12v-3v3
  title: "Плата питания 12 В → 3,3 В"
  subtitle: "Схема электрическая принципиальная"
  doc_code: "САСПИК-01"
  revision: "1"
  language: ru

board:
  width: 100.0
  height: 70.0
  corner_radius: 3.0
  layers: 1
  thickness: 1.6
  copper_um: 35
  edge_clearance: 0.4
  holes:                      # крепёж M3
    - {x: 4.0,  y: 4.0,  d: 3.2}
    - {x: 96.0, y: 4.0,  d: 3.2}
    - {x: 4.0,  y: 66.0, d: 3.2}
    - {x: 96.0, y: 66.0, d: 3.2}

nets:
  "12V": {layer: ШИНА_12В, width: 1.0, current_a: 1.0,  colour: red}
  "3V3": {layer: ШИНА_3В3, width: 0.5, current_a: 0.3,  colour: blue}
  "GND": {layer: ЗЕМЛЯ,    width: 1.0, current_a: 1.0,  colour: green}
  "SIG": {layer: СИГНАЛЫ,  width: 0.3, current_a: 0.02, colour: black}

pour:                          # полигон земли
  enabled: true
  clearance: 0.4
  edge: 0.4
  thermal_spokes: 4
  thermal_angle: 45

module:                        # съёмная плата в розетке
  ref: J2
  type: ESP32-DevKitC
  pins_per_row: 19
  rows: 2
  pitch: 2.54
  x: 48.0                      # x первого контакта верхнего ряда
  row_top_y: 46.43
  row_bottom_y: 23.57
  pin1: right                  # контакт 1 — у правого края
  antenna: right
  source: "ESP32-DevKitC V4 User Guide, Espressif (таблица J2)"
  pinout_status: verified         # verified | user | unverified
  pins:
    1: 3V3
    2: EN
    3: GPIO36
    4: GPIO39
    5: GPIO34
    6: GPIO35
    7: GPIO32
    8: GPIO33
    9: GPIO25
    10: GPIO26
    11: GPIO27
    12: GPIO14
    13: GPIO12
    14: GND
    15: GPIO13
    16: GPIO9
    17: GPIO10
    18: GPIO11
    19: 5V

headers:                       # гребёнки периферии
  - ref: J3
    x: 75.94
    y: 53.0
    functions: [GPIO36, GPIO39, GPIO34, GPIO35, GPIO32, GPIO33, GND, "3V3"]
  - ref: J4
    x: 58.16
    y: 53.0
    functions: [GPIO13, GND, GPIO12, GPIO14, GPIO27, GPIO26, GPIO25]

