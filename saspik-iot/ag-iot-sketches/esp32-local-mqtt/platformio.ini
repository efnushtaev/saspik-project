; PlatformIO конфигурация для ESP32 + DHT22 + MQTT
; Плата: ESP32 DevKit (esp32dev)
; Датчик: DHT22 на GPIO 4
; Светодиод: встроенный GPIO 2 (active low)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Стабильная скорость загрузки для CP2102 (на 460800 срывается верификация)
upload_speed = 115200
extra_scripts = extra_script.py
; Файловая система для энергонезависимого лога (device-log)
board_build.filesystem = littlefs
; Явная 4MB-таблица (partitions.csv). Раздел файловой системы называется "spiffs":
; Arduino-ESP32 LittleFS.begin() ищет раздел именно по имени "spiffs".
board_build.partitions = partitions.csv

lib_extra_dirs =
    ../shared

lib_deps =
    knolleary/PubSubClient @ ^2.8
    adafruit/DHT sensor library @ ^1.4.4
    bblanchon/ArduinoJson @ ^6.21.3