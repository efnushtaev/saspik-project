; PlatformIO конфигурация для шлюза unitId2 на базе GatewayApp (saspik-core).
; Плата: ESP32 DevKit (esp32dev)
; Датчик: DHT22 на GPIO 4
; Светодиод: встроенный GPIO 2 (active low: LOW = вкл)
; ESP-NOW-мост: таблица узлов — в include/config.h (NODE_TABLE).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Стабильная скорость загрузки для CP2102 (на 460800 срывается верификация)
upload_speed = 115200
; Файловая система не используется (RebootCauseStore хранит данные в NVS),
; но таблица разделов оставлена для будущих OTA/сертификатов.
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
; include/ (config.h) виден и src/, и библиотеке saspik-core: без -Iinclude
; модули ядра не видят compile-time константы.
build_flags =
    -Iinclude

; Переиспользуемые библиотеки: shared/wifi-config, shared/device-log и
; saspik-core из boilerplate.
lib_extra_dirs =
    ../shared
    ../esp32-boilerplate/lib
; deep+ — LDF сканирует библиотеку saspik-core целиком (модули ядра
; включают config.h из include/).
lib_ldf_mode = deep+

lib_deps =
    knolleary/PubSubClient @ ^2.8
    adafruit/DHT sensor library @ ^1.4.4
    bblanchon/ArduinoJson @ ^6.21.3
    paulstoffregen/OneWire @ ^2.3.8
