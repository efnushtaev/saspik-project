; Saspik ESP32 boilerplate — SOLID-база для трёх шаблонов прошивок.
;
; Шаблон выбирается build-флагом -DDEVICE_ROLE=N (см. include/config.h):
;   1 = Gateway (шлюз: WiFi + MQTT + ESP-NOW мост)
;   2 = Sensor  (сенсор: ESP-NOW + light sleep + шины)
;   3 = Device  (устройство: ESP-NOW rx/tx + шины)
;
; Общие настройки заданы в [env] и наследуются всеми средами
; (в PIO секция [env] применяется ко всем env без extends).

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
; include/ (config.h) виден и src/, и lib/: PlatformIO добавляет include-путь
; проекта только для src/, а библиотеки компилируются без него — без этого
; флага модули saspik-core не видят compile-time константы (см. архитектуру).
build_flags =
    -Iinclude
; Стабильная скорость загрузки CP2102: на 460800 срывается верификация
; (урок из esp32-local-mqtt, IN_PROGRESS.md).
upload_speed = 115200
; Файловая система LittleFS — для будущих OTA/сертификатов; код пока её не использует
; (лог сокращён до NVS ради стабильности, см. saspik-iot/IN_PROGRESS.md).
board_build.filesystem = littlefs
; Явная 4MB-таблица; раздел назван "spiffs", т.к. Arduino-LittleFS ищет его по имени.
board_build.partitions = partitions.csv
; Переиспользуемые shared-библиотеки (wifi-config, device-log) — как в esp32-local-mqtt.
lib_extra_dirs = ../shared
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21.3
    adafruit/DHT sensor library @ ^1.4.4
    paulstoffregen/OneWire @ ^2.3.8

; ======================== Роли на базовой плате ESP32 ========================

[env:gateway_esp32]
board = esp32dev
build_flags = ${env.build_flags} -DDEVICE_ROLE=1

[env:sensor_esp32]
board = esp32dev
build_flags = ${env.build_flags} -DDEVICE_ROLE=2

[env:device_esp32]
board = esp32dev
build_flags = ${env.build_flags} -DDEVICE_ROLE=3

; ======================== ESP32-S2 ========================

[env:gateway_s2]
board = esp32-s2-saola-1
build_flags = ${env.build_flags} -DDEVICE_ROLE=1

[env:sensor_s2]
board = esp32-s2-saola-1
build_flags = ${env.build_flags} -DDEVICE_ROLE=2

[env:device_s2]
board = esp32-s2-saola-1
build_flags = ${env.build_flags} -DDEVICE_ROLE=3

; ======================== ESP32-S3 ========================

[env:gateway_s3]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DDEVICE_ROLE=1

[env:sensor_s3]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DDEVICE_ROLE=2

[env:device_s3]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DDEVICE_ROLE=3

; ======================== ESP32-C3 ========================

[env:gateway_c3]
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DDEVICE_ROLE=1

[env:sensor_c3]
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DDEVICE_ROLE=2

[env:device_c3]
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DDEVICE_ROLE=3

; ======================== Хост-тесты (native) ========================
; Тестируются только чистые модули (TopicBuilder, EspNowCodec, EspNowMqttBridge,
; ConfigManager, TimerRegistry). Код, зависящий от Arduino, обёрнут в #ifdef ARDUINO
; и в native-сборке компилируется как пустая единица трансляции.
; lib_extra_dirs и lib_deps переопределяются полностью — shared-библиотеки
; и Arduino-зависимости на хосте не собираются.

[env:native]
platform = native
; Сбрасываем framework, унаследованный из [env]: arduino требует board,
; а у native-среды его нет (тестируются только чистые модули).
framework =
test_framework = unity
; deep+ — LDF сканирует и test/: src/ в native пуст (ARDUINO-гварды),
; без этого библиотека saspik-core не обнаруживается по include из тестов.
lib_ldf_mode = deep+
lib_extra_dirs =
; DEVICE_ROLE нужен только потому, что config.h требует его для #if-секций
; идентификации; сами тесты от роли не зависят.
build_flags =
    -DDEVICE_ROLE=2
    -Iinclude
    -Itest/mocks
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3