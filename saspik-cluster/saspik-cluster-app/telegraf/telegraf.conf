# ============================================================================
# Telegraf: подписка на MQTT-топики кластера, запись в InfluxDB.
#
# Сенсорные/командные данные (data_format=json) -> measurement "mqtt_consumer"
# Логи-конверты (topic: device/.../log и т.п.)  -> measurement "logs" (bucket "logs")
#
# Оба поток пишутся в свои бакеты через outputs.influxdb_v2 (namepass).
# ============================================================================

# --- Сенсорные и командные топики (данные) ---
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = [
    "sensor/#",
    "units/#",
    "led/#",
  ]
  username = "admin"
  password = "password123"
  data_format = "json"
  tag_keys = ["topic"]
  json_string_fields = ["state"]

# --- Лог-топики (единый JSON-конверт) -> отдельный measurement "logs" ---
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = [
    "device/+/+/log",
    "server/+/log",
    "rule-engine/+/log",
  ]
  username = "admin"
  password = "password123"
  data_format = "json"
  name_override = "logs"
  # Теги: по ним фильтруем и группируем логи в Influx
  tag_keys = ["topic", "level", "event", "src", "unitId", "objectId"]
  # Строковые поля (сообщение и причина ребута)
  json_string_fields = ["msg", "cause"]

# --- Бакет сенсорных данных (основной) ---
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"
  flush_interval = "1s"
  # Только sensor/command measurement
  namepass = ["mqtt_consumer"]

# --- Бакет логов (отдельный, retention 7 дней) ---
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_LOGS_BUCKET}"
  flush_interval = "1s"
  # Только logs measurement
  namepass = ["logs"]
