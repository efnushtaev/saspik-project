version: '3.8'

services:
  mosquitto:
    build: ./mqtt
    container_name: test_mosquitto
    ports:
      - "1883:1883"
    networks:
      - test-network

  influxdb:
    image: influxdb:2
    container_name: test_influxdb
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=admin123
      - DOCKER_INFLUXDB_INIT_ORG=saspik
      - DOCKER_INFLUXDB_INIT_BUCKET=mqtt
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-token
    ports:
      - "8086:8086"
    networks:
      - test-network

  telegraf:
    build: ./telegraf
    container_name: test_telegraf
    environment:
      - INFLUXDB_TOKEN=my-super-secret-token
      - INFLUXDB_ORG=saspik
      - INFLUXDB_BUCKET=mqtt
    depends_on:
      - mosquitto
      - influxdb
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
