# Данные платы узла meshrover: ESP32-S3-DevKitC-1 (розетка) + DWM3000.
# Геометрия и номиналы живут здесь, оформление — в esp32s3-dwm3000-board.py.
#
# Источники:
#   ESP32-S3-DevKitC-1 — Espressif, «ESP32-S3-DevKitC-1 User Guide v1.1» (§ Header Block)
#                       + DXF_ESP32-S3-DevKitC-1_V1_20210312CB.dxf (габарит 25,4 × 62,87 мм,
#                       шаг 2,54 мм, ряды 22,86 мм, контакт 1 у антенны).
#   DWM3000           — Qorvo, «DWM3000 Data Sheet Rev B, May 2021», Table 2 (Pin Functions)
#                       и § 7.2 Module Land Pattern (24 pin, 13 × 23 мм).

meta:
  title: "Плата узла meshrover: ESP32-S3 + DWM3000"
  doc_code: "САСПИК-МР-ПЛ-001"
  revision: "A"

board:
  width: 80.0
  height: 55.0
  corner_radius: 3.0
  layers: 1
  thickness: 1.6
  copper_um: 35
  holes:
    - {x: 4.0,  y: 4.0,  d: 3.2}
    - {x: 76.0, y: 4.0,  d: 3.2}
    - {x: 4.0,  y: 51.0, d: 3.2}
    - {x: 76.0, y: 51.0, d: 3.2}

# Цепи: слой DXF, ширина меди и расчётный ток.
nets:
  "5V":     {layer: ШИНА_5В,  width: 1.0, current_a: 0.8}
  "5V_IN":  {layer: ШИНА_5В,  width: 0.8, current_a: 0.8}
  "3V3":    {layer: ШИНА_3В3, width: 0.5, current_a: 0.2}
  "GND":    {layer: ЗЕМЛЯ,    width: 1.0, current_a: 0.8}
  "SIG":    {layer: СИГНАЛЫ,  width: 0.3, current_a: 0.02}

# Розетка под ESP32-S3-DevKitC-1: 2 ряда по 22 контакта, шаг 2,54, ряды 22,86.
# Нумерация 1..44: 1..22 — ряд J1 (верхний, у DWM3000), 23..44 — ряд J3 (нижний).
module:
  ref: J2
  type: "Розетка 2×22 под ESP32-S3-DevKitC-1"
  pins_per_row: 22
  pitch: 2.54
  row_spacing: 22.86
  pin1: left
  antenna: left
  placed:
    j1_y: 36.0
    j3_y: 13.14
    x0: 18.25
  source: "ESP32-S3-DevKitC-1 User Guide v1.1, § Header Block; DXF_ESP32-S3-DevKitC-1_V1_20210312CB.dxf"
  pinout_status: verified
  pins:
    1: 3V3
    2: 3V3
    3: EN
    4: GPIO4
    5: GPIO5
    6: GPIO6
    7: GPIO7
    8: GPIO15
    9: GPIO16
    10: GPIO17
    11: GPIO18
    12: GPIO8
    13: GPIO3
    14: GPIO46
    15: GPIO9
    16: GPIO10
    17: GPIO11
    18: GPIO12
    19: GPIO13
    20: GPIO14
    21: 5V
    22: GND
    23: GND
    24: GPIOTX
    25: GPIORX
    26: GPIO1
    27: GPIO2
    28: GPIO42
    29: GPIO41
    30: GPIO40
    31: GPIO39
    32: GPIO38
    33: GPIO37
    34: GPIO36
    35: GPIO35
    36: GPIO0
    37: GPIO45
    38: GPIO48
    39: GPIO47
    40: GPIO21
    41: GPIO20
    42: GPIO19
    43: GND
    44: GND

# DWM3000: корпус 13 × 23 мм, 24 контакта, площадки 1,6 (в плату) × 1,0 (вдоль края).
dwm3000:
  ref: U2
  body: {w: 13.0, h: 23.0}
  pad: {long: 1.6, short: 1.0}
  pitch: 1.4
  antenna_side: right
  keepout: {x0: 53.0, y0: 0.0, x1: 73.0, y1: 17.0}
  source: "Qorvo DWM3000 Data Sheet Rev B (May 2021), Table 2 + § 7.2"
  pinout_status: verified
  pins:
    1: EXTON
    2: WAKEUP
    3: RSTn
    4: GPIO7
    5: VDD1
    6: VDD3V3
    7: VDD3V3
    8: VSS
    9: GPIO6
    10: GPIO5
    11: GPIO4
    12: GPIO3
    13: GPIO2
    14: GPIO1
    15: GPIO0
    16: VSS
    17: SPICSn
    18: SPIMOSI
    19: SPIMISO
    20: SPICLK
    21: VSS
    22: GPIO8
    23: VSS
    24: VSS

# Гребёнки периферии.
headers:
  - ref: J3
    x: 58.0
    y: 47.5
    functions: [TX, RX, GND, "3V3"]

smd: []

wires: []

bom:
  - [J1, "Клеммник 2 конт., 5,08 мм (питание 5 В)", 1]
  - [J2, "Розетка 2×22, шаг 2,54 мм (или 2× PLS 1×22)", 1]
  - [J3, "PLS 1×3, шаг 2,54 мм (UART)", 1]
  - [U1, "AMS1117-3.3, SOT-223", 1]
  - [U2, "DWM3000, 24 конт., 13 × 23 мм", 1]
  - [F1, "Предохранитель самовосст. 1,1 А, 1812", 1]
  - [LED1, "Светодиод зелёный 0805 (питание 5 В)", 1]
  - [LED2, "Светодиод красный 0805 (статус)", 1]
  - [R5, "680 Ом 0805 (LED1)", 1]
  - [R7, "330 Ом 0805 (LED2)", 1]
  - [C1, "10 мкФ / 10 В 0805 (вход 5 В)", 1]
  - [C2, "100 нФ 0805 (вход 5 В)", 1]
  - [C3, "22 мкФ / 10 В 0805 (вход U1)", 1]
  - [C4, "22 мкФ / 10 В 0805 (выход U1)", 1]
  - [C5, "100 нФ 0805 (выход U1)", 1]
  - [WP1, "Перемычка проволочная (IRQ)", 1]
  - [WP2, "Перемычка проволочная (RST)", 1]
  - [WP3, "Перемычка проволочная (GND модуля)", 1]
  - [WP4, "Перемычка проволочная (GND конденсаторов)", 1]

calculations:
  input: "5 В (USB-C), до 1 А"
  rail_5v_peak_a: 0.8
  rail_3v3_a: 0.16
  ldo_drop_v: 1.7
  ldo_power_w: 0.272
  ldo_temp_rise_c: 16
  f1_trip_a: 1.1
  wifi_peak_a: 0.5
  uwb_peak_a: 0.15

manual_checks:
  - "посадочное место DWM3000 — сверить с § 7.2 даташита (площадка 1,6 × 1,0 мм, шаг 1,4 мм)"
  - "номинал F1 подобрать под источник 5 В (USB-C порт ноутбука даёт 0,5 А, пики Wi-Fi до 0,8 А)"
  - "четыре перемычки (IRQ, RST, GND×2) впаиваются проводом 0,3…0,5 мм после травления"
  - "при установке модуля в розетку проверить ориентацию: контакт 1 — слева, ряд J1 — снизу"
  - "тепловой режим U1 при длительном токе DWM3000 в режиме непрерывного TX"
